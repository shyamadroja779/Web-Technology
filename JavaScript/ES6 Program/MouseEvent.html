<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <document class="write">Click Mouse</document>
    <button onclick="(event)">Click Here</button>
    <h1 id="h1"></h1>

    <script>
        document.onmouseup=click;

        function click(event){
            if(event.button==0){
                document.getElementById("h1").innerHTML="Left Click";
            }
            else if(event.button==1){
                document.getElementById("h1").innerHTML="Middle Click";
            }
            else if(event.button==2){
                document.getElementById("h1").innerHTML="Right Click";
            }
        }

    </script>
</body>
</html>
