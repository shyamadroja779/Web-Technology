<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <form action="">
            <input type="checkbox" value="v" onclick="getall()">v
            <input type="checkbox" value="w" onclick="getall()">w
            <input type="checkbox" value="x" onclick="getall()">x
            <input type="checkbox" value="y" onclick="getall()">y
            <input type="checkbox" value="z" onclick="getall()">z
        </form>
    </div>
    <div>
        <p id="result"></p>
    </div>
    <script>
        function getall() {
            var arr = [];
            let a = document.getElementsByTagName("input").vaule;
            arr.push(a);
            for (const i of arr) {
                console.log(i);
                document.getElementById("result").innerHTML = i;
            }
            
        }

    </script>
